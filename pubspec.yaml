name: usb_to_com
description: "macOS 전용 시리얼(USB-to-COM) 터미널"
publish_to: 'none'
version: 0.1.2+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_libserialport: ^0.6.0
  provider: ^6.1.5+1
  xterm2: ^5.2.0
  shared_preferences: ^2.5.5
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: ClipartKorea
      fonts:
        - asset: assets/fonts/clipartkorea_light.ttf
          weight: 300
        - asset: assets/fonts/clipartkorea_regular.ttf
          weight: 400
        - asset: assets/fonts/clipartkorea_medium.ttf
          weight: 500
        - asset: assets/fonts/clipartkorea_bold.ttf
          weight: 700
